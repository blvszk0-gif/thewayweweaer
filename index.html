<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWWW - The Way WE Wear</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { background-color: #0b0f19; color: #f3f4f6; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen font-sans p-6">

    <div class="max-w-md w-full bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl text-center">
        <h1 class="text-3xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-2">
            The Way WE Wear
        </h1>
        <p class="text-gray-400 text-sm mb-6">Wybierz swoją frakcję i dołącz do zamkniętego dropu.</p>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <button onclick="selectFraction('Gracz')" id="btn-gracz" class="py-4 rounded-xl border-2 border-gray-700 hover:border-purple-500 bg-gray-800/50 font-bold transition-all cursor-pointer">
                🎮 GRACZ
            </button>
            <button onclick="selectFraction('Fan Anime')" id="btn-anime" class="py-4 rounded-xl border-2 border-gray-700 hover:border-pink-500 bg-gray-800/50 font-bold transition-all cursor-pointer">
                🧬 FAN ANIME
            </button>
        </div>

        <form id="signup-form" class="space-y-4 hidden">
            <input type="email" id="email-input" required placeholder="Wpisz swój e-mail..." 
                   class="w-full px-4 py-3 rounded-xl bg-gray-950 border border-gray-800 focus:outline-none focus:border-purple-500 text-center">
            <button type="submit" class="w-full py-3 bg-gradient-to-r from-purple-500 to-pink-500 rounded-xl font-bold hover:opacity-90 transition-all cursor-pointer">
                ZAPISZ MNIE NA LISTĘ VIP
            </button>
        </form>

        <div id="success-msg" class="hidden text-green-400 font-bold mt-4 animate-bounce">
            BUM! Zapisano! Twój kot daje okejki! 👍🐱
        </div>
    </div>

    <script>
        let selectedFraction = '';

        function selectFraction(fraction) {
            selectedFraction = fraction;
            
            // Wizualne podświetlenie wybranego przycisku
            document.getElementById('btn-gracz').className = fraction === 'Gracz' ? 'py-4 rounded-xl border-2 border-purple-500 bg-purple-950/30 font-bold transition-all cursor-pointer' : 'py-4 rounded-xl border-2 border-gray-700 bg-gray-800/50 font-bold transition-all cursor-pointer';
            document.getElementById('btn-anime').className = fraction === 'Fan Anime' ? 'py-4 rounded-xl border-2 border-pink-500 bg-pink-950/30 font-bold transition-all cursor-pointer' : 'py-4 rounded-xl border-2 border-gray-700 bg-gray-800/50 font-bold transition-all cursor-pointer';
            
            // Pokaż formularz wpisywania maila
            document.getElementById('signup-form').classList.remove('hidden');
        }

        // Łączenie z Twoim lokalnym PocketBase przez czysty Fetch API
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value;

            try {
                const response = await fetch('http://127.0.0.1:8090/api/collections/zapisy/records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: email,
                        fraction: selectedFraction
                    })
                });

                if (response.ok) {
                    document.getElementById('signup-form').classList.add('hidden');
                    document.getElementById('success-msg').classList.remove('hidden');
                } else {
                    alert('Coś poszło nie tak z bazą danych...');
                }
            } catch (error) {
                console.error(error);
                alert('Brak połączenia z PocketBase. Upewnij się, że serwer działa!');
            }
        });
    </script>
</body>
</html>
</html
